[project]
name = "credito"
version = "0.1.0"
description = "Sustentação de um modelo de risco de crédito: contratos de dados, detecção de drift e observabilidade"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Só o que `src/` importa de fato. `scipy` chegava como dependência transitiva do
# scikit-learn e ficou explícito quando `drift/statistics.py` passou a importar
# `scipy.stats.ks_2samp` diretamente — uma dependência transitiva sem entrada própria some
# do lock na primeira limpeza de árvore que ninguém liga o import a ela. `fastapi`,
# `uvicorn` e `prometheus-client` fizeram o caminho inverso: chegaram a estar aqui sem
# import correspondente, saíram, e voltam agora que `credito.api` (`main.py`/`metrics.py`)
# de fato os importa para servir o campeão e expor a instrumentação Prometheus. `pydantic`
# chegava de carona pelo `pydantic-settings` (que já é dependência direta); passou a ser
# import direto quando `credito.api.schemas` declarou os schemas de entrada/saída da API
# com `pydantic.BaseModel`, e ficou explícito pelo mesmo motivo do `numpy`.
dependencies = [
    "scikit-learn (>=1.5,<2.0)",
    "pandas (>=2.2,<3.0)",
    "numpy (>=2.0,<3.0)",
    "joblib (>=1.4,<2.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "pydantic (>=2.6,<3.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "httpx (>=0.27,<1.0)",
    "prometheus-client (>=0.21,<1.0)",
    "scipy (>=1.13,<2.0)",
    "xgboost (>=2.1,<3.0)",
]

[tool.poetry]
packages = [{ include = "credito", from = "src" }]

# Grupos separados de `main`: a imagem instala `--only main` e não carrega pytest nem
# ruff. É o que mantém a superfície da imagem pequena.
[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
# Versão exata, não faixa: `.pre-commit-config.yaml` e `ci.yml` fixam 0.7.4 no pino, e uma
# faixa aqui deixaria o ambiente local subir uma minor sozinho — o clássico "passa local,
# falha no CI" por regra nova ou formatação diferente. Um teste cobra os três valores.
ruff = "0.7.4"
pre-commit = "^4.0"

# O que só o pipeline usa — contrato de dados, relatório de drift e rastreamento — fica
# fora de `main`: a API de scoring não importa nenhum dos três (medido pelos módulos que
# `credito.api.main` carrega), e a imagem instala `--only main`. Grupo não opcional, então
# `poetry install` local e na CI continuam trazendo os três.
[tool.poetry.group.pipeline.dependencies]
pandera = ">=0.33.1,<0.34"
evidently = ">=0.7.23,<0.8"
mlflow = ">=3.16,<4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

# E/F: erros e pyflakes · I: ordenação de imports · N: nomenclatura PEP8 ·
# UP: sintaxe moderna · B: bugbear · SIM: simplificações · RUF: regras do próprio ruff
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# Filtro de warning é preciso e datado: filtrar a categoria inteira esconde problema.
# Cada entrada diz a causa e quando pode sair.
#
# O primeiro elemento ("error") é o próprio "-W error" do projeto, escrito aqui em vez de
# em "-W" na linha de comando: o pytest aplica os filtros do `filterwarnings` do ini ANTES
# dos de "-W" (`_pytest.config.apply_warning_filters` comenta a ordem: "Filters should be
# applied in the inverse order of precedence" — cmdline por último, logo na frente da
# lista, logo checado primeiro). Um "-W error" na linha de comando por cima deste arquivo
# sempre vence e ignora as duas entradas abaixo — verificado rodando
# `pytest -W error -q` com estas mesmas entradas presentes: a suíte falha do mesmo jeito,
# porque o "-W error" da linha de comando não tem categoria/mensagem, casa com qualquer
# warning e é checado antes de qualquer entrada deste arquivo. Por isso o comando que de
# fato exercita esta configuração é `pytest` puro (sem `-W`), não `pytest -W error`.
filterwarnings = [
    "error",
    # 2026-09-27: `evidently==0.7.23` (pino do próprio pyproject) importa, na cadeia de
    # `from evidently import ...`, o módulo `evidently.legacy.tests.utils`, que ainda
    # escreve em `numpy.core` — renomeado para `numpy._core` desde o NumPy 2.0. Terceiro,
    # não nosso: medido reproduzindo o import isolado (`import evidently` sob
    # `warnings.simplefilter("error", DeprecationWarning)`), o traceback termina dentro
    # do pacote do Evidently, não deste projeto. Sai quando o Evidently corrigir o
    # próprio import ou quando este projeto trocar de biblioteca de drift.
    "ignore:numpy\\.core is deprecated and has been renamed to numpy\\._core:DeprecationWarning",
    # 2026-09-27: o mesmo import de `evidently` carrega, de forma ansiosa (mesmo sem este
    # projeto usar a UI do Evidently), `evidently.legacy.ui.managers.projects`, que ainda
    # chama a API antiga do litestar (`Dependency`/`DependencyKwarg`), depreciada na
    # litestar 2.23 com remoção anunciada para a 3.0. Mesma medição do item acima: o
    # traceback termina dentro do Evidently. Saem quando o Evidently migrar para
    # `litestar.di.NamedDependency` ou quando este projeto trocar de biblioteca de drift.
    "ignore:Call to deprecated function 'Dependency'\\.:DeprecationWarning",
    "ignore:Use of deprecated class 'DependencyKwarg'\\.:DeprecationWarning",
    # 2026-09-27: `scipy.stats.ks_2samp` tenta o cálculo exato do p-valor por padrão
    # (`mode="auto"`) e, para certas combinações de tamanho de amostra e estatística D, a
    # rotina exata (`scipy/stats/_stats_py.py::_attempt_exact_2kssamp`) falha internamente
    # e cai para o modo assintótico emitindo este aviso — comportamento interno do SciPy,
    # não um defeito deste projeto: o p-valor entregue nesse caminho já é a aproximação
    # assintótica padrão, a mesma que `mode="asymp"` pediria explicitamente, então nenhum
    # resultado fica errado. Reproduzido chamando `credito.drift.statistics.ks` (via a
    # orquestração de monitoramento) sobre duas amostras sintéticas de 400
    # linhas cada — o traceback termina dentro do SciPy. Sai quando o SciPy parar de
    # precisar desse fallback ou emitir o aviso de outra forma.
    # O ":" literal da mensagem original ("ks_2samp: Exact...") quebraria o parser de
    # `filterwarnings` do pytest, que separa os campos por ":" sem respeitar escape — por
    # isso o colon vira "\x3a" em regex (o mesmo caractere, sem o literal que confundiria
    # o parser).
    "ignore:ks_2samp\\x3a Exact calculation unsuccessful\\. Switching to method=asymp\\.:RuntimeWarning",
    # 2026-09-27: `evidently==0.7.23` (pino do próprio pyproject) traz, em
    # `evidently/descriptors/text_match.py`, um docstring de `TextMatch` que embute
    # `\b\d{3}-\d{3}-\d{4}\b` numa string comum (não crua). Desde o Python 3.12, o
    # compilador emite este SyntaxWarning na primeira vez que compila o arquivo; com
    # bytecode em cache (`__pycache__`), a recompilação não roda de novo e o aviso não
    # reaparece — por isso a suíte passava localmente e falhava só em ambiente com cache
    # frio, como o `poetry install` do CI. A mensagem filtrada abaixo ("invalid escape
    # sequence '\d'") é a curta, emitida pelo compilador da máquina de import
    # (`importlib`) — diferente da mensagem longa que `compile(fonte, ...)` chamado
    # isoladamente produz; medido comparando as duas via `warnings.catch_warnings(record=
    # True)` ao redor de `import evidently` versus ao redor de um `compile()` avulso do
    # mesmo arquivo, e é a curta que casa com o `SyntaxError: invalid escape sequence
    # '\d'` observado no CI. Terceiro, não nosso: o traceback aponta para a linha do
    # docstring dentro do arquivo do Evidently, e uma busca em `src/` e `tests/` não
    # encontra nenhuma string não-crua com `\d` neste projeto. Sai quando o Evidently
    # corrigir esse docstring (string crua ou escape duplicado) em versão mais nova que
    # 0.7.23, ou quando este projeto trocar de biblioteca de drift.
    "ignore:invalid escape sequence '\\\\d':SyntaxWarning",
    # 2026-09-28: `mlflow==3.16.1` (pino do próprio pyproject, tracking desta etapa), ao
    # inicializar o backend SQLAlchemy (`sqlite:///...`, o backend que este projeto usa —
    # o de arquivo está em modo de manutenção, ver `credito.tracking.mlflow_client`),
    # importa `mlflow/store/tracking/utils/sql_trace_metrics_utils.py`, que chama
    # `sqlalchemy.orm.aliased(...)` no nível do módulo. Essa chamada dispara
    # `configure_mappers()`, que usa a estratégia de carregamento `noload`, depreciada no
    # SQLAlchemy desde a 2.1. Terceiro, não nosso: reproduzido chamando só
    # `mlflow.set_experiment(...)`/`MlflowClient(...)` contra um SQLite em `tmp_path` —
    # nenhum código deste projeto importa SQLAlchemy diretamente — e o traceback termina
    # dentro do MLflow e do SQLAlchemy. Sem este filtro, o primeiro teste da suíte a
    # tocar o backend SQLite do MLflow falha (a suíte inteira compartilha o registro de
    # mappers do SQLAlchemy dentro do processo, então só o primeiro toque dispara o
    # aviso — o que tornaria o resultado sensível à ordem de coleta do pytest se não
    # fosse silenciado aqui, não só o primeiro teste). Sai quando o MLflow migrar da
    # estratégia `noload` ou quando o SQLAlchemy remover essa depreciação.
    "ignore:The ``noload`` loader strategy is deprecated and will be removed in a future release\\.:sqlalchemy.exc.SADeprecationWarning",
    # 2026-09-28: `starlette==1.7.0` (dependência transitiva de `fastapi`, pino desta
    # etapa) tenta `import httpx2` dentro de `starlette/testclient.py` e, ao não achar o
    # pacote (`httpx2` não é dependência deste projeto — só `httpx`, já usado por
    # `credito.data.download`), cai para `import httpx` emitindo este aviso no nível do
    # módulo. Terceiro, não nosso: reproduzido importando só `fastapi.testclient.
    # TestClient` fora da suíte, sob `warnings.simplefilter("error")` — o traceback
    # termina dentro de `starlette/testclient.py`, na chamada de `warnings.warn` logo
    # depois do `except ModuleNotFoundError` do import de `httpx2`. Adicionar `httpx2`
    # como dependência só para calar o aviso trocaria um pacote real (`httpx`, testado e
    # já em uso) por outro não avaliado, pelo único benefício de silenciar um aviso — o
    # filtro documentado é a escolha mais segura aqui. Sai quando o Starlette parar de
    # exigir `httpx2` para `TestClient` (reverter a depreciação) ou quando este projeto
    # adotar `httpx2` deliberadamente, com avaliação própria, não como efeito colateral
    # de calar um aviso.
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.report]
# Piso, não meta: a suíte cobre 98% hoje. 95 deixa espaço para o que é genuinamente fora do
# alcance de um teste que não toca rede nem o dataset real (download, `main()` dos scripts)
# e falha o job de CI no dia em que código novo entrar sem teste — a erosão que, sem piso,
# só aparece quando alguém lê o relatório de cobertura, ou seja, nunca.
fail_under = 95
