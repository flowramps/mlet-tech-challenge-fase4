[project]
name = "credito"
version = "0.1.0"
description = "Sustentação de um modelo de risco de crédito: contratos de dados, detecção de drift e observabilidade"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Só o que `src/` importa de fato. `fastapi`, `uvicorn` e `prometheus-client` estiveram
# aqui sem nenhum import correspondente — as etapas que precisarem de servidor HTTP ou de
# métricas Prometheus declaram isso quando o código existir. `scipy` chegava como
# dependência transitiva do scikit-learn e ficou explícito nesta etapa: `drift/statistics.py`
# importa `scipy.stats.ks_2samp` diretamente, e uma dependência transitiva sem entrada
# própria some do lock na primeira limpeza de árvore que ninguém liga o import a ela.
dependencies = [
    "scikit-learn (>=1.5,<2.0)",
    "pandas (>=2.2,<3.0)",
    "numpy (>=2.0,<3.0)",
    "joblib (>=1.4,<2.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "httpx (>=0.27,<1.0)",
    "pandera (>=0.33.1,<0.34)",
    "scipy (>=1.13,<2.0)",
    "xgboost (>=2.1,<3.0)",
    "evidently (>=0.7.23,<0.8)",
]

[tool.poetry]
packages = [{ include = "credito", from = "src" }]

# Grupos separados de `main`: a imagem instala `--only main` e não carrega pytest nem
# jupyter. É o que mantém a superfície da imagem pequena.
[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
# Versão exata, não faixa: `.pre-commit-config.yaml` e `ci.yml` fixam 0.7.4 no pino, e uma
# faixa aqui deixaria o ambiente local subir uma minor sozinho — o clássico "passa local,
# falha no CI" por regra nova ou formatação diferente. Um teste cobra os três valores.
ruff = "0.7.4"
pre-commit = "^4.0"

[tool.poetry.group.notebooks.dependencies]
jupyter = "^1.1"
matplotlib = "^3.9"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

# E/F: erros e pyflakes · I: ordenação de imports · N: nomenclatura PEP8 ·
# UP: sintaxe moderna · B: bugbear · SIM: simplificações · RUF: regras do próprio ruff
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# Filtro de warning é preciso e datado: filtrar a categoria inteira esconde problema.
# Cada entrada diz a causa e quando pode sair.
filterwarnings = []
