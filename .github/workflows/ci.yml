name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo na mesma branch cancela o run anterior: economiza minutos e mantém a fila
# curta sem perder sinal, já que só o último commit importa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.3.2"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ruff é um binário isolado e rápido: não vale carregar o Poetry só para lintar.
      - name: Instalar ruff
        run: pip install ruff==0.7.4

      - name: Verificar regras de lint
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check .

      # As regras de alerta têm teste próprio: uma regra nunca vista disparando — nem vista
      # NÃO disparando — é decoração. Mesma versão do Prometheus do docker-compose.yml.
      - name: Testar as regras de alerta do Prometheus
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/docker/prometheus:/etc/prometheus:ro" -w /etc/prometheus
          prom/prometheus:v3.15.0 test rules alertas_test.yml

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache do virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependências
        run: poetry install --no-interaction --with dev

      - name: Rodar a suíte com cobertura
        run: poetry run pytest -ra --cov=credito --cov-report=term-missing

  build:
    name: Build (imagem de inferência)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Instalar dependências
        run: poetry install --no-interaction

      # A imagem embute o modelo, então o build só é possível depois do treino. Treinar no
      # CI também prova que o pipeline de treino continua funcionando a cada push — o
      # dataset é baixado automaticamente por `executar_pipeline` se ainda não existir.
      - name: Treinar o modelo
        run: poetry run python -m credito.pipeline.training

      # O cache de build do Actions só funciona no driver `docker-container` do buildx; o
      # driver padrão do runner é `docker`, que não exporta cache.
      - name: Preparar o buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: credito-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Construir não é o mesmo que subir. Este passo é o princípio "suíte verde não é
      # evidência de que a coisa sobe" mecanizado na esteira.
      - name: Verificar que o container responde
        run: |
          docker run -d --rm -p 8000:8000 --name credito-api-ci credito-api:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker stop credito-api-ci
